[workspace]
resolver = "2"
members = [
    "crates/licensing-core",
    "crates/platform",
    "crates/test-support",
    "services/auth_service",
    "services/movie_service",
    "services/song_service",
    "services/song_service",
    "services/search_service",
    "services/license_service",
    "services/license_service",
    "services/notification_service",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Internal crates
licensing-core = { path = "crates/licensing-core" }
# default-features off at the root: release binaries only pre-sign offline.
platform = { path = "crates/platform", default-features = false }
test-support = { path = "crates/test-support" }

# Async runtime + web
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Observability
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# Persistence / security
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
jsonwebtoken = "9"
argon2 = "0.5"
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

# Object storage (MinIO via S3 API)
# No TLS feature: the SDK only ever pre-signs (offline SigV4 math) — dropping
# the https client keeps aws-lc-sys (the OOM-prone C/ASM build) out of the graph.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }

# Testcontainers
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres", "kafka", "redis"] }

# Kafka. Feature selection is per-target (see crates' Cargo.toml):
# macOS links the system librdkafka (brew install librdkafka — the bundled
# cmake C++ build is broken against current SDKs); Linux builds bundled
# librdkafka statically via cmake, so container images carry no Kafka lib.
rdkafka = { version = "0.36", default-features = false }

# Search stack (the official Rust client ships only alpha releases; pinned
# to the 8.x line, compatible with our 8.15.3 server)
elasticsearch = "8.19.0-alpha.1"
redis = { version = "0.27", features = ["tokio", "tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors
thiserror = "2"
anyhow = "1"

# Domain
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Dev dependencies
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = "thin"
strip = true
