[package]
name = "platform"
description = "Infrastructure adapters shared by services: JWT auth middleware, outbox relay, Kafka wrappers, Redis PubSub, SSE helpers, config/tracing bootstrap."
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
licensing-core = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
redis = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
test-support = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rdkafka = { workspace = true, features = ["tokio", "dynamic-linking", "libz"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdkafka = { workspace = true, features = ["tokio", "cmake-build", "libz"] }
