[package]
name = "test-support"
description = "Test helpers: testcontainers fixtures and shared assertions for integration tests."
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
licensing-core = { workspace = true }
# Bucket fixtures dial MinIO over the SDK, so tests opt back into its
# https stack (aws-lc-rs) — dev/test builds only, never release images.
platform = { workspace = true, features = ["sdk-https"] }
tokio = { workspace = true }
sqlx = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
rsa = { workspace = true }
rand_core = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rdkafka = { workspace = true, features = ["tokio", "dynamic-linking", "libz"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdkafka = { workspace = true, features = ["tokio", "cmake-build", "libz"] }
