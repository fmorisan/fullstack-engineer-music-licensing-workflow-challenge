# Local development stack (ADR index: docs/architecture/README.md).
#
# Engine-agnostic compose-spec file: `podman compose` locally (see justfile),
# `docker compose` in CI. Host ports avoid conflicts with common local tools
# (postgres on 5433, mailpit SMTP on 1026, gateway on 8080).

name: acme-licensing

networks:
  acme:

volumes:
  pg_data:
  minio_data:
  kafka_data:
  es_data:

services:
  # ── Postgres: one logical database per service ──────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acme_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acme}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [acme]

  # ── Redis: SSE PubSub fan-out + search cache ────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [acme]

  # ── MinIO: S3-compatible media storage ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [acme]

  # One-shot bucket bootstrap; runs via `just up` (compose `run`), not part of
  # the long-running stack, so `up --wait` doesn't trip on its exit(0).
  minio-init:
    image: minio/mc:latest
    profiles: ["bootstrap"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_MOVIE_MEDIA:-movie-media} &&
      mc mb --ignore-existing local/${S3_BUCKET_SONG_MEDIA:-song-media}
      "
    networks: [acme]

  # ── Kafka: single-node KRaft broker ─────────────────────────────────────────
  # INTERNAL listener for containers (kafka:29092), EXTERNAL for host-run
  # services (localhost:9092). Listener bind hosts stay empty: the image
  # wrapper rejects 0.0.0.0 binds when deriving advertised listeners.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [acme]

  # ── ElasticSearch: song catalog index ───────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [acme]

  # ── Mailpit: email capture (web UI + API :8025, SMTP :1025) ─────────────────
  # No container healthcheck: scratch image has no shell; the HTTP :8025
  # listener doubles as the readiness signal for dependent tooling.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
      - "1026:1025"
    networks: [acme]

  # ── Traefik: L7 gateway with forward-auth ───────────────────────────────────
  # web (:80, published 8080) is the API entrypoint; the insecure API/dashboard
  # (:8080, published 8081 for dev only) doubles as the healthcheck target.
  traefik:
    image: traefik:v3.3
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --accesslog=true
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      # NB: single-file mount — podman on macOS does not propagate host
      # directory mounts (applehv/virtiofs limitation); the file provider
      # still loads it from the directory path.
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/version >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [acme]
