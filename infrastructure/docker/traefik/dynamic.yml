# Dynamic Traefik configuration (file provider, watched).
#
# Phase 1: middleware skeleton only. Routers are attached per-service in
# Phase 8 (see docs/architecture/02-adr-traefik-forward-auth-gateway.md).
# Services are addressed by container name on the internal Docker network.

http:
  middlewares:
    # ── Authentication / authorization ────────────────────────────────────────
    # forward-auth calls auth_service /verify with the caller's Authorization
    # header. 200 => request proceeds with X-User-Id/X-User-Role injected;
    # 401/403 => the request never reaches the upstream service.
    auth:
      forwardAuth:
        address: http://auth_service:8101/verify
        authResponseHeaders:
          - X-User-Id
          - X-User-Role
          - X-User-Org

    auth-studio:
      forwardAuth:
        address: http://auth_service:8101/verify?role=STUDIO
        authResponseHeaders:
          - X-User-Id
          - X-User-Role
          - X-User-Org

    auth-label:
      forwardAuth:
        address: http://auth_service:8101/verify?role=LABEL
        authResponseHeaders:
          - X-User-Id
          - X-User-Role
          - X-User-Org

    auth-admin:
      forwardAuth:
        address: http://auth_service:8101/verify?role=ADMIN
        authResponseHeaders:
          - X-User-Id
          - X-User-Role
          - X-User-Org

    # ── Cross-origin (frontend dev server) ────────────────────────────────────
    cors-dev:
      headers:
        accessControlAllowOriginList:
          - http://localhost:5173
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true

    # ── SSE safety ────────────────────────────────────────────────────────────
    # Attached to event-stream routes if response compression is ever enabled
    # globally; disables proxy hint that could buffer the stream.
    sse-safe:
      headers:
        customResponseHeaders:
          X-Accel-Buffering: "no"
