# Postgres: one instance, one logical database per service (ADR-003).
# The init SQL only runs against an empty volume — same bootstrap contract
# as the compose stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  10-databases.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE movie_db;
    CREATE DATABASE song_db;
    CREATE DATABASE license_db;
    CREATE DATABASE notification_db;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: acme }
            - { name: POSTGRES_PASSWORD, value: acme_dev_only }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U acme"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: initdb
          configMap: { name: postgres-initdb }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
