# The six Rust services. Environment mirrors compose.services.yml with
# dashed service hostnames; the dev JWT keypair mounts from `acme-keys`.
# Boot ordering is left to Kubernetes: services retry their dependencies
# (crash → backoff → rejoin), and migrations run at boot.
#
# Common shape per service:
#   Deployment (image acme-<service>:dev, /healthz probes, /keys secret)
#   Service    (ClusterIP, port 81xx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: localhost/acme-services:dev
          imagePullPolicy: Never
          command: ["auth_service"]
          env:
            - { name: DATABASE_URL, value: "postgres://acme:acme_dev_only@postgres:5432/auth_db" }
            - { name: JWT_PRIVATE_KEY_FILE, value: /keys/private }
            - { name: PORT, value: "8101" }
          ports: [{ containerPort: 8101 }]
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8101 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: 8101 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: keys
          secret: { secretName: acme-keys }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 8101, targetPort: 8101 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: movie-service }
  template:
    metadata:
      labels: { app: movie-service }
    spec:
      containers:
        - name: movie-service
          image: localhost/acme-services:dev
          imagePullPolicy: Never
          command: ["movie_service"]
          env:
            - { name: DATABASE_URL, value: "postgres://acme:acme_dev_only@postgres:5432/movie_db" }
            - { name: LICENSE_SERVICE_URL, value: "http://license-service:8105" }
            # Presigning is offline math; the URL names the browser-facing
            # host (served by the localhost port-forward), not a cluster one.
            - { name: S3_ENDPOINT, value: "http://localhost:9000" }
            - { name: S3_ACCESS_KEY, value: minioadmin }
            - { name: S3_SECRET_KEY, value: minioadmin }
            - { name: JWT_PUBLIC_KEY_FILE, value: /keys/public }
            - { name: PORT, value: "8102" }
          ports: [{ containerPort: 8102 }]
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
          readinessProbe:
              httpGet: { path: /healthz, port: 8102 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8102 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: keys
          secret: { secretName: acme-keys }
---
apiVersion: v1
kind: Service
metadata:
  name: movie-service
spec:
  selector: { app: movie-service }
  ports: [{ port: 8102, targetPort: 8102 }]
---
